const SCENARIO = STUB_SCENARIO;
const META = SCENARIO.meta || {};
const NODES = {};
(SCENARIO.nodes || []).forEach(function (n) { NODES[n.id] = n; });
const STORAGE_KEY = 'first90days-save-v1-s46';

/* ---------- date helpers (weekdays always computed, never hard-coded) ---------- */
function parseISO(iso) {
  const p = String(iso).split('-').map(Number);
  return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
}
function addDays(d, n) { const t = new Date(d); t.setDate(t.getDate() + n); return t; }
function toISO(d) {
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + mm + '-' + dd;
}
function fmtDate(d) {
  return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}
function nodeDate(node) { return addDays(parseISO(META.startDateISO), node.dayOffset || 0); }
function fmtCash(n) { return (n < 0 ? '-$' : '$') + Math.abs(n); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ---------- state ---------- */
let state = null;        // active run state
let view = 'start';      // 'start' | 'interstitial' | 'story'

function freshState() {
  return {
    nodeId: META.startNode,
    cash: (typeof META.startCash === 'number' ? META.startCash : 240),
    flags: [],
    hidden: [],
    removalDateISO: null,
    pendingNote: null
  };
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}
function loadSave() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !NODES[s.nodeId]) return null;
    if (!Array.isArray(s.flags)) s.flags = [];
    if (!Array.isArray(s.hidden)) s.hidden = [];
    return s;
  } catch (e) { return null; }
}
function clearSave() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
}
function hasFlag(f) { return state && state.flags.indexOf(f) !== -1; }

/* ---------- shared fragments ---------- */
function hudHTML(node) {
  let h = '<div class="hud">' +
    '<span class="date">' + esc(fmtDate(nodeDate(node))) + '</span>' +
    '<span class="cash">Cash: ' + esc(fmtCash(state.cash)) + '</span></div>';
  if (hasFlag('removed') && state.removalDateISO) {
    const deadline = addDays(parseISO(state.removalDateISO), 3);
    h += '<div class="deadline" role="alert">Shelter care hearing deadline: ' +
      esc(fmtDate(deadline)) + '</div>';
  }
  return h;
}

function hiddenPanelHTML(revealAll) {
  const count = state.hidden.length;
  const released = hasFlag('recordsRequested');
  let h = '<section class="panel' + ((released || revealAll) ? ' revealed' : '') +
    '" aria-label="Assessment panel">';
  if (released || revealAll) {
    h += '<h3>Assessment — record</h3>';
    if (count === 0) {
      h += '<p>No items have been rated yet.</p>';
    } else {
      h += '<p>Items rated so far: <strong>' + count + '</strong></p><ul>';
      state.hidden.forEach(function (item) { h += '<li>' + esc(item) + '</li>'; });
      h += '</ul>';
    }
    if (released) h += '<p class="caption">Released on request — 55 Pa. Code § 3130.44(d)</p>';
  } else {
    h += '<h3>🔒 Assessment — you are being rated on items you cannot see</h3>' +
      '<p>Items rated so far: <strong>' + count + '</strong></p>' +
      '<p class="caption">The contents of this record are hidden from you.</p>';
  }
  return h + '</section>';
}

/* ---------- screens ---------- */
const app = document.getElementById('app');

function renderStart() {
  view = 'start';
  const existing = loadSave();
  let h = '<p class="kicker">A Tactic Watch simulation</p>' +
    '<h1>' + esc(META.title || 'The First 90 Days') + '</h1>' +
    '<p class="subtitle">' + esc(META.subtitle || '') + '</p>' +
    '<div class="card">' +
    '<p class="disclaimer">A fictional composite story — no real family\'s case</p>' +
    '<p class="disclaimer">Prototype — pending attorney verification</p>' +
    '<p class="disclaimer">General information, not legal advice</p>' +
    '</div>' +
    '<div class="card warning"><h3>Content warning</h3>' +
    '<p>This story involves the child welfare system and the possible removal of children from their home. It may be upsetting. You can pause, skip, or exit at any time — the Quick Exit button at the top of every screen instantly switches to a neutral page.</p></div>' +
    '<button class="btn primary" id="startBtn" type="button">Start the story</button>';
  if (existing) {
    h += '<button class="btn center" id="continueBtn" type="button">Continue where you left off</button>';
  }
  app.innerHTML = h;
  document.getElementById('startBtn').addEventListener('click', function () {
    state = freshState();
    save();
    renderNode();
  });
  if (existing) {
    document.getElementById('continueBtn').addEventListener('click', function () {
      state = loadSave();
      if (!state) { renderStart(); return; }
      if (state.pendingNote) { renderInterstitial(); } else { renderNode(); }
    });
  }
}

function renderInterstitial() {
  view = 'interstitial';
  const node = NODES[state.nodeId];
  app.innerHTML = hudHTML(node) +
    '<div class="notebox" role="note">' + esc(state.pendingNote || '') + '</div>' +
    '<button class="btn primary" id="noteContinue" type="button">Continue</button>';
  document.getElementById('noteContinue').addEventListener('click', function () {
    state.pendingNote = null;
    save();
    renderNode();
  });
}

function applyChoice(choice, currentNode) {
  if (typeof choice.cash === 'number') state.cash += choice.cash;
  if (choice.setFlags) {
    const flags = Array.isArray(choice.setFlags) ? choice.setFlags : Object.keys(choice.setFlags);
    flags.forEach(function (f) {
      if (state.flags.indexOf(f) === -1) state.flags.push(f);
      if (f === 'removed' && !state.removalDateISO) {
        /* Removal date = the in-story date of the node where the flag was set. */
        state.removalDateISO = toISO(nodeDate(currentNode));
      }
    });
  }
  if (choice.addHidden) {
    const items = Array.isArray(choice.addHidden) ? choice.addHidden
      : (typeof choice.addHidden === 'string' ? [choice.addHidden] : []);
    items.forEach(function (item) { state.hidden.push(String(item)); });
  }
  state.nodeId = choice.next;
  state.pendingNote = choice.note || null;
  save();
  if (state.pendingNote) { renderInterstitial(); } else { renderNode(); }
}

function renderNode() {
  view = 'story';
  const node = NODES[state.nodeId];
  if (!node) { renderStart(); return; }
  if (node.ending) { renderEnding(node); return; }
  let h = hudHTML(node);
  h += '<p class="kicker">' + esc(node.kicker || '') + '</p>' +
    '<h2>' + esc(node.title || '') + '</h2>';
  (node.body || []).forEach(function (p) { h += '<p>' + esc(p) + '</p>'; });
  h += hiddenPanelHTML(false);
  (node.choices || []).forEach(function (choice, i) {
    h += '<button class="btn" type="button" data-choice="' + i + '">' + esc(choice.text) + '</button>';
  });
  app.innerHTML = h;
  Array.prototype.forEach.call(app.querySelectorAll('[data-choice]'), function (btn) {
    btn.addEventListener('click', function () {
      applyChoice(node.choices[Number(btn.getAttribute('data-choice'))], node);
    });
  });
  window.scrollTo(0, 0);
}

function renderEnding(node) {
  view = 'story';
  let h = hudHTML(node);
  h += '<p class="kicker">' + esc(node.kicker || '') + '</p>' +
    '<h2>' + esc(node.title || '') + '</h2>';
  (node.body || []).forEach(function (p) { h += '<p>' + esc(p) + '</p>'; });
  if (node.debrief && node.debrief.length) {
    h += '<div class="card"><h3>Debrief — the real law behind this story</h3><ul class="debrief">';
    node.debrief.forEach(function (line) { h += '<li>' + esc(line) + '</li>'; });
    h += '</ul></div>';
  }
  /* On ending screens the full hidden record is always revealed. */
  h += '<div class="card"><h3>The assessment record, revealed</h3>' + hiddenPanelHTML(true) + '</div>';
  h += '<button class="btn primary" id="againBtn" type="button">Play again</button>' +
    '<button class="btn center" id="otherBtn" type="button">Try the other path</button>' +
    '<p class="credit">Built with the Tactic Watch law library — every deadline in this story is real law, cited in the debrief</p>';
  app.innerHTML = h;
  document.getElementById('againBtn').addEventListener('click', function () {
    clearSave();
    state = null;
    renderStart();
  });
  document.getElementById('otherBtn').addEventListener('click', function () {
    clearSave();
    state = freshState();
    save();
    renderNode();
  });
  window.scrollTo(0, 0);
}

/* ---------- Quick Exit decoy ---------- */
const decoy = document.getElementById('decoy');
const topbar = document.getElementById('topbar');
document.getElementById('quickExitBtn').addEventListener('click', function () {
  app.hidden = true;
  topbar.hidden = true;
  decoy.hidden = false;
  window.scrollTo(0, 0);
});
document.getElementById('backBtn').addEventListener('click', function () {
  decoy.hidden = true;
  app.hidden = false;
  topbar.hidden = false;
  if (view === 'start') renderStart();
  else if (view === 'interstitial') renderInterstitial();
  else renderNode();
});

/* ---------- init ---------- */
renderStart();
</script>
